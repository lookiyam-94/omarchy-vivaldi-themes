# Cursor Dark — Cursor's editor palette on Grok's black
# Colours lifted from Cursor's built-in "Cursor Dark" theme; ANSI slots are
# Cursor's own terminal colours. Chrome stays greyscale, one blue signal.

mode                     = "dark"

accent                   = "#8fbfff"
selection                = "#2e2e2e"
muted                    = "#6e6e6e"

background               = "#191919"
dark_background          = "#141414"
darker_background        = "#0b0b0b"
lighter_background       = "#1f1f1f"

foreground               = "#e4e4e4"
dark_foreground          = "#8a8a8a"
light_foreground         = "#dbdbdb"
bright_foreground        = "#f5f5f5"

# Focused window: Cursor white fading into link blue
hyprland_active_border   = "rgba(f5f5f5dd) rgba(71aeffee) 45deg"
hyprland_inactive_border = "rgba(2a2a2aaa)"

red                      = "#ff7f7a"
yellow                   = "#f9b25a"
orange                   = "#ff8750"
green                    = "#73d697"
cyan                     = "#80d1c1"
blue                     = "#8fbfff"
magenta                  = "#ad90ff"
brown                    = "#a87a5a"

bright_red               = "#ff6161"
bright_yellow            = "#f69f16"
bright_orange            = "#ffa27a"
bright_green             = "#41cb7e"
bright_cyan              = "#5bc6b3"
bright_blue              = "#71aeff"
bright_magenta           = "#ff9690"
